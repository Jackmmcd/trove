<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trove — Offline</title>
<style>
  :root { color-scheme: light; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #ffffff;
    color: #282828;
    font-family: "Courier New", Courier, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px calc(24px + env(safe-area-inset-right)) 24px calc(24px + env(safe-area-inset-left));
    text-align: center;
  }
  .mark {
    background: #e67e00; color: #000;
    font-weight: 900; font-size: 18px; letter-spacing: 2px;
    padding: 8px 16px; display: inline-block; margin-bottom: 20px;
  }
  h1 { font-size: 15px; letter-spacing: 2px; margin: 0 0 10px; color: #c26a00; }
  p { font-size: 13px; line-height: 1.7; color: #5e5e5e; margin: 0 0 20px; max-width: 34ch; }
  button {
    background: #e67e00; color: #000; border: none;
    font-family: inherit; font-weight: bold; font-size: 12px; letter-spacing: 2px;
    padding: 12px 22px; cursor: pointer; min-height: 44px;
  }
</style>
</head>
<body>
  <div>
    <div class="mark">TROVE</div>
    <h1>NO CONNECTION</h1>
    <p>
      Trove shows live balances and quotes, so it will not show you numbers it
      cannot verify. Reconnect and try again.
    </p>
    <button onclick="location.reload()">RETRY</button>
  </div>
</body>
</html>
